name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run check:catalog
      - run: npm run check:public-content
      - run: npm pack --dry-run
      - run: npm pack --dry-run
        working-directory: packages/cli
